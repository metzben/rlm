[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm-sandbox"
version = "0.1.0"
description = "Recursive Language Model (RLM) harness that runs inside a Docker Sandbox"
requires-python = ">=3.13"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rlm = "rlm.cli:main"

[tool.setuptools]
packages = ["rlm"]
