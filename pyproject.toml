[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm-sandbox"
version = "0.1.0"
description = "Recursive Language Model (RLM) harness that runs inside a Docker Sandbox"
requires-python = ">=3.13"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rlm = "rlm.cli:main"

[tool.setuptools]
packages = ["rlm"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
# Explicit, version-stable rule set: pyflakes (F), pycodestyle errors (E),
# and the 79-char limit (E501). Broader defaults in newer ruff versions
# flag patterns this codebase uses deliberately (kernel exec, blind except).
select = ["E4", "E7", "E9", "F", "E501"]
